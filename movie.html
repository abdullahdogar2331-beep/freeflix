<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FreeFlix Player</title>

  <link rel="stylesheet" href="style.css">

  <style>

    body {
      min-height: 100vh;
      background: #050505;
    }

    .player-page {
      min-height: 100vh;
      padding: 35px 5%;
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .player-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    .player-brand-logo {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: #000;
      font-size: 23px;
    }

    .back-button {
      border: 1px solid var(--line);
      background: transparent;
      color: white;
      padding: 11px 17px;
    }

    .back-button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .video-wrapper {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      background: #000;
      border: 1px solid var(--line);
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
    }

    .video-wrapper video {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }

    .player-empty {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: 30px;
      text-align: center;
      background:
        radial-gradient(
          circle at center,
          rgba(233,255,69,.08),
          transparent 45%
        ),
        #050505;
    }

    .player-empty-inner {
      max-width: 600px;
    }

    .player-f {
      color: var(--accent);
      font-size: 70px;
      font-weight: 900;
      margin-bottom: 20px;
    }

    .player-empty h1 {
      font-size: clamp(30px, 5vw, 60px);
      line-height: 1;
      margin-bottom: 15px;
    }

    .player-empty p {
      color: var(--muted);
      max-width: 550px;
      margin: auto;
    }

    .player-info {
      width: 100%;
      max-width: 1200px;
      margin: 35px auto 0;
    }

    .player-label {
      color: var(--accent);
      font-size: 10px;
      letter-spacing: 3px;
      font-weight: 800;
    }

    .player-info h2 {
      margin-top: 10px;
      font-size: clamp(35px, 5vw, 65px);
      line-height: 1;
    }

    .player-info p {
      margin-top: 18px;
      color: var(--muted);
      max-width: 700px;
    }

    .player-actions {
      margin-top: 25px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    @media (max-width: 600px) {

      .player-page {
        padding: 20px;
      }

      .player-header {
        align-items: flex-start;
      }

      .player-brand {
        font-size: 13px;
      }

      .video-wrapper {
        aspect-ratio: 16 / 10;
      }

    }

  </style>

</head>

<body>

  <main class="player-page">

    <header class="player-header">

      <a href="index.html" class="player-brand">

        <div class="player-brand-logo">
          F
        </div>

        FREEFLIX

      </a>

      <a href="index.html" class="back-button">
        ← Back
      </a>

    </header>


    <section class="video-wrapper">

      <video
        id="moviePlayer"
        controls
        playsinline
        preload="metadata"
      >
        <!--
          LEGAL VIDEO SOURCE GOES HERE.

          Example structure only:

          <source
            src="YOUR-LEGAL-VIDEO-FILE.mp4"
            type="video/mp4"
          >

        -->

        Your browser does not support HTML5 video.

      </video>


      <div class="player-empty" id="playerEmpty">

        <div class="player-empty-inner">

          <div class="player-f">
            F
          </div>

          <h1>
            Player Ready
          </h1>

          <p>
            This player is ready for a legally available free film.
            A video source must be connected before playback can begin.
          </p>

        </div>

      </div>

    </section>


    <section class="player-info">

      <span class="player-label">
        FREEFLIX PLAYER
      </span>

      <h2 id="movieTitle">
        Movie
      </h2>

      <p>
        Watch films only when their video files are legally available
        for free use or streaming.
      </p>

      <div class="player-actions">

        <button
          class="secondary-button"
          id="fullscreenButton"
        >
          Fullscreen
        </button>

        <a
          href="index.html"
          class="secondary-button"
        >
          Browse More
        </a>

      </div>

    </section>

  </main>


  <script>

    const params =
      new URLSearchParams(window.location.search);

    const movieName =
      params.get("movie");

    const movieTitle =
      document.getElementById("movieTitle");

    const video =
      document.getElementById("moviePlayer");

    const empty =
      document.getElementById("playerEmpty");

    const fullscreenButton =
      document.getElementById("fullscreenButton");


    if (movieName) {

      movieTitle.textContent =
        movieName;

      document.title =
        `${movieName} — FreeFlix`;

    }


    /*
      The empty state stays visible until
      a real legal source is connected.
    */

    video.addEventListener("loadeddata", () => {

      empty.style.display = "none";

    });


    fullscreenButton.addEventListener("click", () => {

      if (video.requestFullscreen) {

        video.requestFullscreen();

      } else if (video.webkitEnterFullscreen) {

        video.webkitEnterFullscreen();

      }

    });

  </script>

</body>
</html>
